name: Tests

on:
  push:
    branches: [main, develop, borg2-b25]
  pull_request:
    branches: [main, develop, borg2-b25]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"  # keep in sync with docker/runtime-base.env
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  SMOKE_URL: "http://localhost:8082"

jobs:
  prepare:
    name: CI / Preparation and contract guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks from complete PR diff
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci/pr_scope.py --event "$CI_EVENT_NAME" \
            --base "$PR_BASE_SHA" --head "$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"

      # Only successful main runs write this cache. Resolve it ONCE so all
      # shards use the same weights, even if main finishes during this run.
      - name: Restore trusted backend timing history
        if: steps.scope.outputs.backend == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ci-timings/history.json
          key: backend-unit-timings-${{ runner.os }}-v1-${{ github.sha }}
          restore-keys: backend-unit-timings-${{ runner.os }}-v1-

      - name: Ensure timing baseline exists
        if: steps.scope.outputs.backend == 'true'
        run: |
          mkdir -p ci-timings
          test -s ci-timings/history.json || printf '{}\n' > ci-timings/history.json

      - name: Freeze timing baseline for all shards
        if: steps.scope.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-timing-baseline
          path: ci-timings/history.json
          if-no-files-found: error
          retention-days: 1

      - name: Compute runtime base tag
        id: tag
        run: echo "image=docker.io/ainullcode/borg-ui-runtime-base:$(bash docker/runtime-base-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Python for required contract guards
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install contract dependencies
        run: pip install -r requirements.txt

      - name: Backend lint and format
        id: backend-lint
        if: steps.scope.outputs.backend == 'true'
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Check frontend and backend contract invariants
        id: frontend-contracts
        if: ${{ !cancelled() }}
        run: |
          pytest -q \
            tests/unit/test_borg2_only_url_prefixes_parity.py \
            tests/unit/test_borg_version_boundaries.py \
            tests/unit/test_borg_dispatch_guardrails.py \
            tests/unit/test_npm_audit_known_vulns.py

  # Guard failures stay fatal in the summary, but independent tests still run.
  # Explicit status functions override GitHub's implicit success() dependency gate.
  backend-unit-coverage:
    name: Backend / Unit Tests (${{ matrix.shard }}/${{ matrix.total_shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total_shards: [6]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      # SQLite forgives what Postgres rejects: it enforces a foreign key only
      # when asked to, and works the next id out from the data instead of a
      # sequence. Anything resting on either can only be proven here.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: borg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup shellcheck

      - name: Verify Borg installation
        run: |
          borg --version
          which borg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test directories
        run: |
          mkdir -p /tmp/borg-ui-tests
          mkdir -p data
          mkdir -p logs
          mkdir -p coverage-data

      - name: Select backend unit test shard
        # Every shard downloads the immutable manifest produced by prepare.
        # A failed download fails this shard; independent fallback would risk
        # assigning different files on different runners.
        uses: actions/download-artifact@v8
        with:
          name: backend-unit-timing-baseline
          path: ci-timings

      - name: Assign backend unit test shard
        run: |
          python -m pytest tests/unit --collect-only -q -o addopts='' > .pytest-unit-nodes.txt
          python scripts/ci/select_pytest_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-total "${{ matrix.total_shards }}" \
            --durations-file ci-timings/history.json \
            < .pytest-unit-nodes.txt \
            > .pytest-unit-shard.txt
          test -s .pytest-unit-shard.txt
          echo "Shard ${{ matrix.shard }}/${{ matrix.total_shards }} selected $(wc -l < .pytest-unit-shard.txt) test files:"
          sed 's/^/  /' .pytest-unit-shard.txt

      - name: Run backend unit coverage shard
        run: |
          mapfile -t PYTEST_FILES < .pytest-unit-shard.txt
          pytest \
            "${PYTEST_FILES[@]}" \
            -v \
            --cov=app \
            --cov-report=term-missing \
            --durations=50 \
            --junitxml=test-results/unit-${{ matrix.shard }}.xml \
            -o junit_family=xunit1
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          BORG_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/borg_test
          COVERAGE_FILE: coverage-data/unit-${{ matrix.shard }}.coverage

      - name: Upload backend unit timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-junit-${{ matrix.shard }}
          path: test-results/unit-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend coverage data
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-coverage-${{ matrix.shard }}
          path: coverage-data/unit-${{ matrix.shard }}.coverage
          if-no-files-found: error
          retention-days: 7

  backend-unit-coverage-combine:
    name: Backend / Unit Coverage Report
    runs-on: ubuntu-latest
    needs: [prepare, backend-unit-coverage]
    if: needs.prepare.outputs.backend == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install coverage dependency
        run: |
          python -m pip install --upgrade pip
          pip install "$(sed -n '/^coverage\[toml\]==/p' requirements.txt)"

      - name: Download backend unit timing reports
        uses: actions/download-artifact@v8
        with:
          pattern: backend-unit-junit-*
          path: test-results
          merge-multiple: true

      - name: Download backend coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: backend-unit-coverage-*
          path: coverage-artifacts/backend
          merge-multiple: true

      - name: Require every unit shard report
        run: >-
          python scripts/ci/verify_shard_reports.py --shards 6
          --junit-dir test-results --coverage-dir coverage-artifacts/backend

      - name: Merge backend unit timings
        run: python scripts/ci/pytest_durations.py test-results/unit-*.xml --output ci-timings/history.json

      - name: Upload fresh backend timing history
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-timing-history
          path: ci-timings/history.json
          if-no-files-found: error
          retention-days: 7

      - name: Combine backend coverage
        run: |
          ls -la coverage-artifacts/backend
          coverage combine coverage-artifacts/backend/*.coverage
          coverage report --show-missing
          coverage xml
          coverage html

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-backend
          path: htmlcov/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: backend-unit
          name: backend-unit-coverage
          verbose: true
          fail_ci_if_error: false

  backend-migration-paths:
    name: Backend / Migration Upgrade Paths (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.backend == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: borg_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Each release's database is built by that release's own code,
          # taken from its tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Every matrix entry owns a separate runner, Postgres service and temp
      # directory. Never parallelize tests against one shared migration DB.
      # File-only weights keep assignments stable if a new release tag expands
      # parameter counts between checkouts on the two runners.
      - name: Select complete migration file shard
        run: |
          python -m pytest tests/migrations --collect-only -q -o addopts='' > .pytest-migration-nodes.txt
          python scripts/ci/select_pytest_shard.py \
            --shard-index "${{ matrix.shard }}" --shard-total 2 --balance-by files \
            < .pytest-migration-nodes.txt > .pytest-migration-shard.txt
          test -s .pytest-migration-shard.txt
        env:
          BORG_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/borg_test
          BORG_TEST_REQUIRE_RELEASE_TAGS: "1"

      - name: Run migration upgrade path tests
        run: |
          mapfile -t PYTEST_FILES < .pytest-migration-shard.txt
          pytest "${PYTEST_FILES[@]}" -v --durations=50 --junitxml=test-results/migrations-${{ matrix.shard }}.xml
        env:
          BORG_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/borg_test
          BORG_TEST_REQUIRE_RELEASE_TAGS: "1"

      - name: Upload migration timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-migration-junit-${{ matrix.shard }}
          path: test-results/migrations-${{ matrix.shard }}.xml
          if-no-files-found: error
          retention-days: 7

  backend-api-integration:
    name: Backend / Integration Tests
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.backend == 'true' }}
    # Without a cap a hung test holds the runner for GitHub's six hour
    # default; the suite finishes in a couple of minutes.
    timeout-minutes: 20
    # Run inside the runtime base image so both Borg 1 and Borg 2 are the exact
    # builds users get (apt only ships a Borg 1, and Borg 2 cannot be built or
    # run on the runner's glibc/OpenSSL). A Borg bump PR stays red here until its
    # base image is pushed, same as the Dockerfile base-image guard.
    container:
      image: ${{ needs.prepare.outputs.image }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Borg installation
        run: |
          borg --version
          borg2 --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test directories
        run: |
          mkdir -p /tmp/borg-ui-tests
          mkdir -p data
          mkdir -p logs

      # The container runs as root, which can create any path and so hides
      # permission failures. Run as the image's non-root borg user, the way the
      # app runs in production and the way the job ran on the plain runner.
      - name: Run backend integration suite
        run: |
          chown -R borg:borg . /tmp/borg-ui-tests
          gosu borg pytest tests/integration -v --durations=50 --junitxml=test-results/integration.xml
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379

      - name: Upload integration timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-integration-junit
          path: test-results/integration.xml
          if-no-files-found: error
          retention-days: 7

  typecheck-lint-format:
    name: Frontend / Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check locale key parity
        working-directory: frontend
        run: npm run check:locales

      - name: Test snapshot worker safety
        working-directory: frontend
        run: node --test scripts/snapshot-workers.node-test.mjs

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

      - name: Run linter
        working-directory: frontend
        run: npm run lint

  frontend-vitest:
    name: Frontend / Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-lcov
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          disable_search: true
          flags: frontend
          name: frontend-coverage
          verbose: true
          fail_ci_if_error: false

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check build output
        working-directory: frontend
        run: |
          if [ -d "dist" ]; then
            echo "Build successful - dist directory created"
            ls -lah dist/ | head -20
          elif [ -d "build" ]; then
            echo "Build successful - build directory created"
            ls -lah build/ | head -20
          else
            echo "Build directory not found"
            ls -lah
            exit 1
          fi

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-output
          path: |
            frontend/build/
            frontend/dist/
          if-no-files-found: error
          retention-days: 7

  smoke-borg-core:
    name: Smoke / Core (borg ${{ matrix.borg }})
    if: ${{ !cancelled() && needs.frontend-build.result == 'success' && needs.prepare.outputs.image != '' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [frontend-build, prepare]
    strategy:
      fail-fast: false
      matrix:
        # image: the Borg 1.4.x and Borg 2 builds users get (runtime base image).
        # apt: the Borg 1 that distributions ship (1.2.x on Ubuntu 24.04).
        borg: [image, apt]
    container: ${{ matrix.borg == 'image' && needs.prepare.outputs.image || null }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.borg == 'apt'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        if: matrix.borg == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup

      - name: Verify Borg installation
        run: |
          borg --version
          if [ "${{ matrix.borg }}" = image ]; then borg2 --version; fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-output
          path: frontend-artifact

      - name: Copy frontend build to static directory
        run: |
          mkdir -p app/static
          if [ -d "frontend-artifact/build" ]; then
            cp -r frontend-artifact/build/* app/static/
          elif [ -d "frontend-artifact/dist" ]; then
            cp -r frontend-artifact/dist/* app/static/
          elif [ -d "frontend-artifact/frontend/build" ]; then
            cp -r frontend-artifact/frontend/build/* app/static/
          elif [ -d "frontend-artifact/frontend/dist" ]; then
            cp -r frontend-artifact/frontend/dist/* app/static/
          else
            echo "Frontend build artifact did not contain build output"
            find frontend-artifact -maxdepth 4 -type d | sort
            exit 1
          fi

      - name: Create smoke test data
        run: |
          chmod +x tests/setup_test_env.sh
          ./tests/setup_test_env.sh

      - name: Start Borg UI backend
        run: |
          mkdir -p data logs
          uvicorn app.main:app --host 0.0.0.0 --port 8082 > logs/backend.log 2>&1 &
          echo $! > /tmp/borg-ui.pid
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          REDIS_HOST: ${{ matrix.borg == 'image' && 'redis' || 'localhost' }}
          REDIS_PORT: 6379
          ACTIVATION_SERVICE_URL: ""

      - name: Wait for service to be ready
        run: |
          timeout 60 bash -c 'until curl -s ${{ env.SMOKE_URL }}/api/docs > /dev/null; do sleep 2; done'

      - name: Run core smoke suite
        run: |
          python3 tests/smoke/run_core_smoke.py --url ${{ env.SMOKE_URL }}
        env:
          BORG_UI_CONTAINER: false

      - name: Stop Borg UI
        if: always()
        run: |
          if [ -f /tmp/borg-ui.pid ]; then
            kill "$(cat /tmp/borg-ui.pid)" || true
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-core-artifacts-${{ matrix.borg }}
          path: |
            /tmp/borg-ui-tests/TEST_INFO.txt
            logs/
          if-no-files-found: ignore
          retention-days: 7

  smoke-borg-extended:
    name: Smoke / Extended (borg ${{ matrix.borg }})
    if: ${{ !cancelled() && needs.frontend-build.result == 'success' && needs.prepare.outputs.image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [frontend-build, prepare]
    strategy:
      fail-fast: false
      matrix:
        # image: the Borg 1.4.x and Borg 2 builds users get (runtime base image).
        # apt: the Borg 1 that distributions ship (1.2.x on Ubuntu 24.04).
        borg: [image, apt]
    container: ${{ matrix.borg == 'image' && needs.prepare.outputs.image || null }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.borg == 'apt'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        if: matrix.borg == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup

      - name: Verify Borg installation
        run: |
          borg --version
          if [ "${{ matrix.borg }}" = image ]; then borg2 --version; fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-output
          path: frontend-artifact

      - name: Copy frontend build to static directory
        run: |
          mkdir -p app/static
          if [ -d "frontend-artifact/build" ]; then
            cp -r frontend-artifact/build/* app/static/
          elif [ -d "frontend-artifact/dist" ]; then
            cp -r frontend-artifact/dist/* app/static/
          elif [ -d "frontend-artifact/frontend/build" ]; then
            cp -r frontend-artifact/frontend/build/* app/static/
          elif [ -d "frontend-artifact/frontend/dist" ]; then
            cp -r frontend-artifact/frontend/dist/* app/static/
          else
            echo "Frontend build artifact did not contain build output"
            find frontend-artifact -maxdepth 4 -type d | sort
            exit 1
          fi

      - name: Create smoke test data
        run: |
          chmod +x tests/setup_test_env.sh
          ./tests/setup_test_env.sh

      - name: Start Borg UI backend
        run: |
          mkdir -p data logs
          uvicorn app.main:app --host 0.0.0.0 --port 8082 > logs/backend.log 2>&1 &
          echo $! > /tmp/borg-ui.pid
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          REDIS_HOST: ${{ matrix.borg == 'image' && 'redis' || 'localhost' }}
          REDIS_PORT: 6379
          ACTIVATION_SERVICE_URL: ""

      - name: Wait for service to be ready
        run: |
          timeout 60 bash -c 'until curl -s ${{ env.SMOKE_URL }}/api/docs > /dev/null; do sleep 2; done'

      - name: Run extended smoke suite
        run: |
          python3 tests/smoke/run_extended_smoke.py --url ${{ env.SMOKE_URL }}
        env:
          BORG_UI_CONTAINER: false

      - name: Stop Borg UI
        if: always()
        run: |
          if [ -f /tmp/borg-ui.pid ]; then
            kill "$(cat /tmp/borg-ui.pid)" || true
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-extended-artifacts-${{ matrix.borg }}
          path: |
            /tmp/borg-ui-tests/TEST_INFO.txt
            logs/
          if-no-files-found: ignore
          retention-days: 7

  smoke-borg-ssh-localhost:
    name: Smoke / SSH (borg ${{ matrix.borg }})
    if: ${{ !cancelled() && needs.frontend-build.result == 'success' && needs.prepare.outputs.image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend-build, prepare]
    strategy:
      fail-fast: false
      matrix:
        # image: the Borg builds users get (runtime base image). apt: the
        # Borg 1 that distributions ship (1.2.x on Ubuntu 24.04).
        borg: [image, apt]
    # --privileged: sshfs mounts need /dev/fuse and CAP_SYS_ADMIN.
    container: ${{ matrix.borg == 'image' && fromJSON(format('{{"image":"{0}","options":"--privileged"}}', needs.prepare.outputs.image)) || null }}

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        if: matrix.borg == 'apt'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.borg }}" = apt ]; then
            sudo apt-get install -y borgbackup openssh-server sshfs
          else
            # borg, borg2 and sshfs already ship in the image
            sudo apt-get install -y openssh-server
          fi
          # SSHFS source mounts use allow_other.
          echo user_allow_other | sudo tee -a /etc/fuse.conf

      - name: Configure localhost SSH target
        run: |
          sudo useradd -m -s /bin/bash borgsmoke || true
          sudo mkdir -p /home/borgsmoke/.ssh
          sudo touch /home/borgsmoke/.ssh/authorized_keys
          sudo chown borgsmoke:borgsmoke /home/borgsmoke
          sudo chmod 755 /home/borgsmoke
          sudo chmod 700 /home/borgsmoke/.ssh
          sudo chmod 600 /home/borgsmoke/.ssh/authorized_keys
          sudo chown -R borgsmoke:borgsmoke /home/borgsmoke/.ssh
          echo 'Port 2222' | sudo tee -a /etc/ssh/sshd_config
          echo 'PasswordAuthentication no' | sudo tee -a /etc/ssh/sshd_config
          echo 'PubkeyAuthentication yes' | sudo tee -a /etc/ssh/sshd_config
          echo 'PermitRootLogin no' | sudo tee -a /etc/ssh/sshd_config
          # An account that can only use SFTP, like a Hetzner Storage Box
          sudo useradd -m -s /bin/bash borgsftp || true
          sudo install -d -o borgsftp -g borgsftp -m 700 /home/borgsftp/.ssh
          sudo install -o borgsftp -g borgsftp -m 600 /dev/null /home/borgsftp/.ssh/authorized_keys
          printf 'Match User borgsftp\n  ForceCommand internal-sftp\n' | sudo tee -a /etc/ssh/sshd_config
          # Sources the smoke writes inside the SSH user's home
          sudo install -d -m 0777 /home/borgsmoke/smoke-src
          # Runner images export XDG_* paths into the runner's home through
          # /etc/environment, which PAM applies to every SSH login. Borg run
          # over SSH as borgsmoke would then write its config there.
          grep '^XDG_' /etc/environment || true
          sudo sed -i '/^XDG_/d' /etc/environment
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222

      - name: Verify Borg installation
        run: |
          borg --version
          if [ "${{ matrix.borg }}" = image ]; then borg2 --version; fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-output
          path: frontend-artifact

      - name: Copy frontend build to static directory
        run: |
          mkdir -p app/static
          if [ -d "frontend-artifact/build" ]; then
            cp -r frontend-artifact/build/* app/static/
          elif [ -d "frontend-artifact/dist" ]; then
            cp -r frontend-artifact/dist/* app/static/
          elif [ -d "frontend-artifact/frontend/build" ]; then
            cp -r frontend-artifact/frontend/build/* app/static/
          elif [ -d "frontend-artifact/frontend/dist" ]; then
            cp -r frontend-artifact/frontend/dist/* app/static/
          else
            echo "Frontend build artifact did not contain build output"
            find frontend-artifact -maxdepth 4 -type d | sort
            exit 1
          fi

      - name: Start Borg UI backend
        run: |
          mkdir -p data logs
          uvicorn app.main:app --host 0.0.0.0 --port 8082 > logs/backend.log 2>&1 &
          echo $! > /tmp/borg-ui.pid
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          REDIS_HOST: ${{ matrix.borg == 'image' && 'redis' || 'localhost' }}
          REDIS_PORT: 6379
          ACTIVATION_SERVICE_URL: ""

      - name: Wait for service to be ready
        run: |
          timeout 60 bash -c 'until curl -s ${{ env.SMOKE_URL }}/api/docs > /dev/null; do sleep 2; done'

      - name: Run localhost SSH smoke
        run: |
          python3 tests/smoke/test_remote_ssh_smoke.py --url ${{ env.SMOKE_URL }}
        env:
          BORG_UI_CONTAINER: false
          SSH_SMOKE_HOST: 127.0.0.1
          SSH_SMOKE_PORT: 2222
          SSH_SMOKE_USER: borgsmoke
          SSH_SMOKE_AUTH_KEYS: /home/borgsmoke/.ssh/authorized_keys
          SSH_SMOKE_REMOTE_REPO: /home/borgsmoke/remote-repo

      - name: Run SSHFS busy-unmount smoke
        run: |
          python3 tests/smoke/test_sshfs_busy_unmount_smoke.py --url ${{ env.SMOKE_URL }}
        env:
          BORG_UI_CONTAINER: false
          SSH_SMOKE_HOST: 127.0.0.1
          SSH_SMOKE_PORT: 2222
          SSH_SMOKE_USER: borgsmoke
          SSH_SMOKE_AUTH_KEYS: /home/borgsmoke/.ssh/authorized_keys

      - name: Run remote source plan routes smoke
        run: |
          python3 tests/smoke/test_remote_source_plan_routes_smoke.py --url ${{ env.SMOKE_URL }}
        env:
          BORG_UI_CONTAINER: false
          SSH_SMOKE_HOST: 127.0.0.1
          SSH_SMOKE_ALT_HOST: localhost
          SSH_SMOKE_PORT: 2222
          SSH_SMOKE_USER: borgsmoke
          SSH_SMOKE_AUTH_KEYS: /home/borgsmoke/.ssh/authorized_keys
          SSH_SMOKE_LOGIN_HOME: /home/borgsmoke
          SSH_SMOKE_SOURCE_ROOT: /home/borgsmoke/smoke-src
          SSH_SMOKE_SFTP_USER: borgsftp
          SSH_SMOKE_SFTP_AUTH_KEYS: /home/borgsftp/.ssh/authorized_keys

      - name: Stop Borg UI
        if: always()
        run: |
          if [ -f /tmp/borg-ui.pid ]; then
            kill "$(cat /tmp/borg-ui.pid)" || true
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-ssh-localhost-artifacts-${{ matrix.borg }}
          path: |
            logs/
          if-no-files-found: ignore
          retention-days: 7

  e2e-browser:
    name: E2E / Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-build]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y borgbackup openssh-server sshpass

      - name: Start the SSH target
        run: sudo E2E_SSH_PORT=2222 tests/e2e/setup-sshd.sh

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-build-output
          path: frontend-artifact

      - name: Copy frontend build to static directory
        run: |
          mkdir -p app/static
          cp -r frontend-artifact/build/* app/static/

      - name: Start Borg UI backend
        run: |
          mkdir -p data logs
          # ssh-copy-id makes its temp dir under ~/.ssh; the image has one, a fresh runner does not.
          install -d -m 700 ~/.ssh
          uvicorn app.main:app --host 0.0.0.0 --port 8082 > logs/backend.log 2>&1 &
        env:
          DATA_DIR: ${{ github.workspace }}/data
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ACTIVATION_SERVICE_URL: ""

      - name: Wait for service to be ready
        run: |
          timeout 60 bash -c 'until curl -s ${{ env.SMOKE_URL }}/api/docs > /dev/null; do sleep 2; done'

      - name: Run browser e2e
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ env.SMOKE_URL }}
          E2E_SSH_HOST: 127.0.0.1
          E2E_SSH_PORT: 2222

      - name: Upload traces and backend log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-browser-artifacts
          path: |
            frontend/e2e-results/
            logs/
          if-no-files-found: ignore
          retention-days: 7

  test-results:
    name: CI / Summary
    runs-on: ubuntu-latest
    needs: [prepare, backend-unit-coverage, backend-unit-coverage-combine, backend-migration-paths, backend-api-integration, typecheck-lint-format, frontend-vitest, frontend-build, smoke-borg-core, smoke-borg-extended, smoke-borg-ssh-localhost, e2e-browser]
    if: always()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check every selected result
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci/check_results.py

      # This runs only AFTER the complete selected suite passed. PRs can read
      # main's history, but cannot publish weights for other PRs to consume.
      - name: Download successful main timing history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: backend-unit-timing-history
          path: ci-timings

      - name: Save trusted backend timing history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ci-timings/history.json
          key: backend-unit-timings-${{ runner.os }}-v1-${{ github.sha }}
