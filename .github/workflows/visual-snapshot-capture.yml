name: Capture Storybook Visual Snapshots

on:
  pull_request:
    branches: [main, develop, borg2-b25]
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/.storybook/**"
      - "frontend/scripts/**"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/visual-regression.yml"
      - ".github/workflows/visual-snapshot-capture.yml"

# Only superseded PR captures are cancelled. Trusted publication keeps its
# separate, non-cancelling queue in visual-regression.yml.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Shots are independent, so stories are split round-robin across runners.
  # Each runner keeps the default 2 workers and the same readiness waits:
  # more workers on one runner did not give reliable pixel equivalence.
  capture:
    name: Capture Storybook snapshots (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3]

    steps:
      # No ref: pull_request checks out refs/pull/N/merge, so the snapshots show
      # the PR applied to the current base, not whatever branch it was cut from.
      - name: Checkout pull request merged with base
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        uses: ./.github/actions/install-playwright-chromium
        with:
          working-directory: frontend
          browsers-path: "0"

      - name: Capture Storybook snapshots
        working-directory: frontend
        run: npm run visual:screenshots
        env:
          STORYBOOK_SNAPSHOTS_DIR: ${{ github.workspace }}/visual-actual
          STORYBOOK_SNAPSHOT_SHARD: ${{ matrix.shard }}/3

      - name: Upload visual snapshot shard
        uses: actions/upload-artifact@v7
        with:
          name: visual-actual-${{ matrix.shard }}
          path: visual-actual
          if-no-files-found: error
          retention-days: 1

  # visual-regression.yml downloads one visual-actual artifact. This job only
  # runs when every shard succeeded, so a partial set is never published.
  merge:
    name: Merge Storybook snapshots
    runs-on: ubuntu-latest
    needs: capture
    steps:
      - name: Merge visual snapshot shards
        uses: actions/upload-artifact/merge@v7
        with:
          name: visual-actual
          pattern: visual-actual-*
          retention-days: 1
