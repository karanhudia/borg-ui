name: Security Scan

on:
  push:
    branches: [ main, develop, borg2-b25 ]
  pull_request:
    branches: [ main, develop, borg2-b25 ]
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggering

concurrency:
  # Only PR runs share a group. Non-PR runs need distinct pending slots so
  # rapid pushes or manual runs cannot replace an older queued security scan.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required permissions for uploading to GitHub Security tab
permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write
  issues: write  # Required for posting PR comments (GitHub uses the issues API)

jobs:
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'  # keep in sync with docker/runtime-base.env

      - name: Self-test the path checker
        if: ${{ !cancelled() }}
        id: path-checker-self-test
        run: ./scripts/check-no-personal-paths.sh --self-test

      - name: Check for personal paths in tracked files
        if: ${{ !cancelled() }}
        id: personal-paths
        run: ./scripts/check-no-personal-paths.sh

      - name: Setup Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          # jest-dom 7 and jsdom 30 require Node >= 22; match the repo-wide
          # Node 22 used by tests.yml.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        # --no-audit: the bundled npm 10 would otherwise submit its own audit
        # request here; redundant, the dedicated step below audits with npm 11.
        # Audit-only installs need no lifecycle hooks; dependency scripts must
        # not modify inputs or gate code used by the following security scans.
        run: npm ci --no-audit --ignore-scripts

      - name: Update npm for the bulk advisory endpoint
        if: ${{ !cancelled() }}
        # npm tries the bulk advisory endpoint first and falls back to the
        # quick-audit endpoint when the bulk request fails or returns data it
        # cannot use. Node 22's bundled npm 10 ends up on that fallback, which
        # the registry retired on 2026-09-04 (audit runs failed with "audit
        # endpoint returned an error") and later restored. npm >= 11 completes
        # on the bulk advisory endpoint, so the audit no longer depends on the
        # legacy path; pinned to the exact release validated against this
        # lockfile so the security gate's own tooling cannot drift between runs.
        run: |
          npm install -g npm@11.19.0 --ignore-scripts
          test "$(npm --version)" = "11.19.0"

      - name: Run npm audit
        if: ${{ !cancelled() }}
        id: npm-audit
        working-directory: frontend
        run: |
          # Audit production dependencies only (omit dev) — devDependencies like oxlint
          # and their transitive deps never ship to production
          # and are not part of the runtime attack surface. npm audit has no ignore
          # flag, so a wrapper gates the JSON against a tracked allowlist of reviewed,
          # non-applicable advisories (security/npm-audit-known-vulns.json).
          #
          # `|| true` keeps npm's exit code from failing the step (it exits non-zero
          # whenever vulnerabilities exist, which is the case we want to filter, not
          # abort on). That is only safe because the gate validates the report shape:
          # an npm error payload, an empty file, or a report without a
          # `vulnerabilities` object fails the gate instead of parsing as clean.
          npm audit --omit=dev --json > npm-audit.json || true
          python3 ../scripts/npm_audit_known_vulns.py gate --file npm-audit.json --level moderate
        continue-on-error: false

      - name: Generate npm audit report
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit > npm-audit-report.txt || true

      - name: Upload npm audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: |
            frontend/npm-audit-report.json
            frontend/npm-audit-report.txt
          retention-days: 30

      - name: Install pip-audit
        if: ${{ !cancelled() }}
        run: pip install pip-audit

      - name: Run pip-audit
        if: ${{ !cancelled() }}
        id: pip-audit
        run: |
          # Scan requirements.txt for vulnerabilities
          # Ignore known vulnerabilities with no available fix:
          # - GHSA-wp53-j4wj-2cfg: python-multipart (fix requires Python 3.10+)
          # - GHSA-wj6h-64fc-37mp: ecdsa (no fix available)
          # - CVE-2026-4539: pygments (transitive via structlog, no fix released yet)
          # Tracked no-fix findings under active review:
          # - security/pip-audit-known-vulns.json
          mapfile -t known_no_fix_ignore_args < <(python3 scripts/pip_audit_known_vulns.py ignore-args)
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-wp53-j4wj-2cfg \
            --ignore-vuln GHSA-wj6h-64fc-37mp \
            --ignore-vuln CVE-2026-4539 \
            "${known_no_fix_ignore_args[@]}"

      - name: Generate pip-audit report
        if: ${{ !cancelled() }}
        run: |
          pip-audit -r requirements.txt --format json > pip-audit-report.json || true
          pip-audit -r requirements.txt > pip-audit-report.txt || true

      - name: Upload pip-audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: |
            pip-audit-report.json
            pip-audit-report.txt
          retention-days: 30

      - name: Run Trivy vulnerability scanner (filesystem)
        if: ${{ !cancelled() }}
        id: trivy-fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report but don't fail (we have known Python 3.9 limitations)

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate human-readable Trivy report
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-filesystem-report
          path: trivy-report.txt
          retention-days: 30

      - name: Create security summary
        if: always()
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.npm-audit.outcome }}" == "success" ]; then
            echo "✅ **Frontend (npm audit):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Frontend (npm audit):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.pip-audit.outcome }}" == "success" ]; then
            echo "✅ **Backend (pip-audit):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Backend (pip-audit):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.trivy-fs.outcome }}" == "success" ]; then
            echo "✅ **Filesystem (Trivy):** PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Filesystem (Trivy):** FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Detailed reports available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if applicable)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Security Scan Results\n\n';

            comment += `**Commit:** ${context.sha.substring(0, 7)}\n\n`;
            comment += '| Check | Status |\n';
            comment += '|-------|--------|\n';
            comment += `| Frontend (npm audit) | ${'${{ steps.npm-audit.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED'} |\n`;
            comment += `| Backend (pip-audit) | ${'${{ steps.pip-audit.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED'} |\n`;
            comment += `| Filesystem (Trivy) | ${'${{ steps.trivy-fs.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED'} |\n`;
            comment += '\n📊 See workflow artifacts for detailed reports.\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      - name: Require every security gate to pass
        if: always()
        env:
          SECURITY_CHECK_RESULTS: ${{ toJSON(steps) }}
        run: python3 scripts/ci/check_security_results.py

  trivy-docker:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare frontend build context
        run: |
          rm -rf docker/frontend-build-output
          mkdir -p docker/frontend-build-output
          if [ -d "frontend/build" ]; then
            cp -R frontend/build/. docker/frontend-build-output/
          elif [ -d "frontend/dist" ]; then
            cp -R frontend/dist/. docker/frontend-build-output/
          else
            echo "Frontend build output was not produced"
            find frontend -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Build runtime base image
        run: docker build -f Dockerfile.runtime-base -t borg-ui-runtime-base:security-scan .

      - name: Build Docker image
        run: docker build --build-arg BASE_IMAGE=borg-ui-runtime-base:security-scan -t borg-ui:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'borg-ui:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report but don't fail (we have known Python 3.9 limitations)

      - name: Upload Trivy Docker results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'

      - name: Generate human-readable Docker report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'borg-ui:${{ github.sha }}'
          format: 'table'
          output: 'trivy-docker-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Docker scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-docker-report
          path: trivy-docker-report.txt
          retention-days: 30
