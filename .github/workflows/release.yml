name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.1.0)

# Ensure only one release creation runs at a time for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel, let it finish

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release tag and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          ./scripts/check-release-version.sh "$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Get version from tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Get previous tag
        id: previous_tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -A 1 "$RELEASE_TAG" | tail -1)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$RELEASE_TAG" ]; then
            # No previous tag, use initial commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREVIOUS_TAG"

      - name: Generate changelog
        id: changelog
        # Nothing derived from a ref or a tag name is expanded into the shell
        # body below. A tag is attacker-controlled input as far as this job is
        # concerned, and only the tag being released is validated, not the
        # previous one this step picks off the tag list.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          REPO_SLUG: ${{ github.repository }}
          ASSET_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          {
            echo 'changelog<<EOF'
            echo "## What's Changed"
            echo ""

            # Get commits between previous tag and current tag
            git log "${PREVIOUS_TAG}..${RELEASE_TAG}" \
              --pretty=format:"* %s (%h)" \
              --no-merges \
              | grep -v "^* chore: bump version" || echo "* Initial release"

            echo ""
            echo ""
            echo "## Docker Images"
            echo ""
            echo "Published to Docker Hub:"
            echo '```'
            echo "docker pull ainullcode/borg-ui:${RELEASE_VERSION}"
            if [[ "${IS_PRERELEASE}" != "true" ]]; then
              echo "docker pull ainullcode/borg-ui:latest"
            fi
            echo '```'
            echo ""
            echo "## Install without Docker"
            echo ""
            echo "Debian or Ubuntu host (bare metal, VM, or LXC):"
            echo '```'
            # The installer is an asset of this release, so the command names a
            # published artifact rather than a branch that can move under it,
            # and its checksum is verified before it runs as root.
            echo "curl -fsSLO ${ASSET_BASE}/install.sh"
            echo "curl -fsSL ${ASSET_BASE}/install.sh.sha256 | sha256sum -c - \\"
            echo "  && sudo bash install.sh --version ${RELEASE_VERSION}"
            echo '```'
            echo ""
            echo "**Full Changelog**: https://github.com/${REPO_SLUG}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The tarball scripts/install.sh downloads: application source, prebuilt
      # frontend, agent wheelhouse and the pinned Borg/rclone versions. Without
      # it a native install has nothing to fetch, so this runs before the
      # release is created rather than as a follow-up job.
      - name: Build native install tarball
        run: ./scripts/build-native-tarball.sh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          files: |
            dist/borg-ui-${{ steps.version.outputs.version }}.tar.gz
            dist/borg-ui-${{ steps.version.outputs.version }}.tar.gz.sha256
            dist/install.sh
            dist/install.sh.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
